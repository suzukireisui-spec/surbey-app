<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REC-Location</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:      #1f3a2e;
    --forest-deep: #142720;
    --moss:        #4c7a57;
    --moss-bright: #6fae7c;
    --bark:        #8b5e3c;
    --paper:       #f5f3ec;
    --paper-dim:   #e8e4d6;
    --ink:         #1a1a1a;
    --amber:       #d98e04;
    --red:         #b23a2e;
    --line:        #cfc9b4;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%; margin:0; padding:0;
    font-family:'Zen Kaku Gothic New', system-ui, sans-serif;
    color:var(--ink); background:var(--forest-deep);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }

  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }

  /* ---------- header ---------- */
  header{
    background:var(--forest); color:var(--paper);
    padding:10px 12px calc(10px + env(safe-area-inset-top)) 12px;
    padding-top:calc(10px + env(safe-area-inset-top));
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    border-bottom:2px solid var(--moss);
    z-index:20;
  }
  header h1{
    font-size:15px; font-weight:900; margin:0; letter-spacing:.02em;
    white-space:nowrap;
  }
  .field-group{ display:flex; align-items:center; gap:6px; }
  .field-group label{ font-size:11px; color:var(--paper-dim); white-space:nowrap; }
  header select, header input[type=text]{
    background:var(--forest-deep); color:var(--paper); border:1px solid var(--moss);
    border-radius:4px; padding:6px 8px; font-size:14px; font-family:inherit;
    width:64px;
  }
  header input[type=text]{ width:56px; text-align:center; font-weight:700; }
  #gpsBadge{
    margin-left:auto; display:flex; align-items:center; gap:6px;
    font-size:12px; padding:5px 9px; border-radius:20px; background:var(--forest-deep);
    border:1px solid var(--moss);
  }
  #gpsDot{ width:9px; height:9px; border-radius:50%; background:var(--red); flex:none; }
  #gpsDot.ok{ background:var(--moss-bright); }
  #gpsDot.warn{ background:var(--amber); }

  /* ---------- map ---------- */
  /* isolation:isolate で#mapWrap自体を新しいスタッキングコンテキストにし、
     #mapにも明示z-indexを与えることで、Leaflet内部要素(コントロール等はz-index:1000)が
     兄弟要素であるボタン類の手前に漏れ出さないようにする */
  #mapWrap{ position:relative; flex:1 1 auto; min-height:0; isolation:isolate; }
  #map{ position:absolute; inset:0; z-index:0; }

  #recenterBtn{
    position:absolute; right:12px; bottom:12px; z-index:1000;
    width:44px; height:44px; border-radius:50%; border:none;
    background:var(--paper); color:var(--forest); box-shadow:0 2px 8px rgba(0,0,0,.35);
    font-size:20px; display:flex; align-items:center; justify-content:center;
  }

  #pinBtn{
    position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
    z-index:1000; display:flex; align-items:center; gap:6px;
    background:var(--moss); color:#fff; border:none; border-radius:24px;
    padding:9px 16px; font-size:16px; font-weight:700; font-family:inherit;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  #pinBtn:active{ background:var(--moss-bright); }
  #pinBtn .num{
    font-family:'JetBrains Mono', monospace; background:rgba(255,255,255,.18);
    border-radius:5px; padding:1px 6px; font-size:12px;
  }
  #pinBtn:disabled{ background:#5a5a52; opacity:.7; }

  .leaflet-div-icon{ background:transparent; border:none; }
  .pin-icon{
    display:flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    background:var(--bark); border:2px solid var(--paper); box-shadow:0 1px 4px rgba(0,0,0,.5);
  }
  .pin-icon span{ transform:rotate(45deg); color:#fff; font-size:10px; font-weight:700; font-family:'JetBrains Mono',monospace; }

  /* ---------- bottom sheet ---------- */
  #sheet{
    background:var(--paper); border-top:2px solid var(--forest);
    flex:0 0 auto; display:flex; flex-direction:column;
    height:34vh; min-height:120px; max-height:70vh;
    z-index:18;
  }
  #sheetHandle{
    flex:none; display:flex; align-items:center; justify-content:center; gap:10px;
    padding:7px 12px; cursor:ns-resize; border-bottom:1px solid var(--line);
  }
  #sheetHandle .bar{ width:36px; height:4px; border-radius:2px; background:var(--line); }
  #sheetTitle{ font-size:12px; color:var(--forest); font-weight:700; margin-right:auto; }
  #countBadge{
    font-family:'JetBrains Mono', monospace; font-size:11px; background:var(--forest);
    color:var(--paper); border-radius:10px; padding:2px 8px;
  }

  #tableScroll{ flex:1 1 auto; overflow:auto; -webkit-overflow-scrolling:touch; }
  table{ width:100%; border-collapse:collapse; font-size:12px; }
  thead th{
    position:sticky; top:0; background:var(--paper-dim); color:var(--forest);
    text-align:left; padding:6px 7px; font-weight:700; border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tbody td{ padding:5px 7px; border-bottom:1px solid var(--paper-dim); vertical-align:middle; }
  tbody tr:active{ background:#efe9d5; }
  td.label{ font-family:'JetBrains Mono', monospace; font-weight:700; color:var(--bark); white-space:nowrap; }
  td.coord{ font-family:'JetBrains Mono', monospace; color:#555; white-space:nowrap; font-size:11px; }
  td input{
    width:100%; border:1px solid transparent; background:transparent; font:inherit;
    padding:4px 3px; border-radius:3px; color:var(--ink);
  }
  td input:focus{ border-color:var(--moss); background:#fff; outline:none; }
  .delBtn{
    border:none; background:none; color:var(--red); font-size:16px; padding:4px 8px; font-weight:700;
  }
  #emptyRow td{ text-align:center; color:#8a8a7a; padding:22px 10px; font-size:13px; }

  /* ---------- footer actions ---------- */
  #actions{
    flex:none; display:flex; gap:8px; padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line); background:var(--paper-dim);
  }
  #actions button{
    flex:1; border:none; border-radius:6px; padding:10px 6px; font-size:12.5px;
    font-family:inherit; font-weight:700; color:#fff;
  }
  #exportCsvBtn{ background:var(--forest); }
  #exportLspBtn{ background:var(--bark); }
  #saveJsonBtn, #loadJsonBtn{ background:#6b6b5f; flex:0 0 auto; padding:10px 12px; }

  /* ---------- modal ---------- */
  #modalOverlay{
    position:fixed; inset:0; background:rgba(10,15,12,.6); z-index:2000;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  #modalOverlay.show{ display:flex; }
  #modalBox{
    background:var(--paper); border-radius:10px; padding:20px; max-width:340px; width:100%;
    border-top:4px solid var(--moss);
  }
  #modalBox h2{ font-size:16px; margin:0 0 10px; color:var(--forest); }
  #modalBox p{ font-size:13px; line-height:1.6; margin:0 0 14px; color:#444; }
  #modalBox input{
    width:100%; padding:10px; font-size:16px; border:1px solid var(--line); border-radius:6px;
    margin-bottom:14px; font-family:inherit; text-align:center; font-weight:700;
  }
  #modalBox button{
    width:100%; padding:11px; background:var(--moss); color:#fff; border:none; border-radius:6px;
    font-size:15px; font-weight:700; font-family:inherit;
  }
  #toast{
    position:fixed; left:50%; bottom:90px; transform:translateX(-50%); z-index:2100;
    background:var(--ink); color:#fff; padding:9px 16px; border-radius:20px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  #toast.show{ opacity:.95; }
  #fileInputHidden{ display:none; }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>REC-Location</h1>
    <div class="field-group">
      <label>系番号</label>
      <select id="zoneSelect">
        <option value="7">7系(石川・富山・岐阜・愛知)</option>
        <option value="8" selected>8系(新潟・長野・山梨・静岡)</option>
        <option value="9">9系(東京・関東各県)</option>
      </select>
    </div>
    <div class="field-group">
      <label>記号</label>
      <input type="text" id="symbolInput" maxlength="4" value="A">
    </div>
    <div id="gpsBadge">
      <div id="gpsDot"></div>
      <span id="gpsText">GPS取得中…</span>
    </div>
  </header>

  <div id="mapWrap">
    <div id="map"></div>
    <button id="recenterBtn" title="現在地に移動">◎</button>
    <button id="pinBtn">📍 <span class="num" id="nextLabel">A1</span></button>
  </div>

  <div id="sheet">
    <div id="sheetHandle">
      <span id="sheetTitle">調査地点一覧</span>
      <span id="countBadge">0件</span>
      <div class="bar"></div>
    </div>
    <div id="tableScroll">
      <table>
        <thead>
          <tr>
            <th>No</th><th>緯度</th><th>経度</th><th>樹種</th><th>メモ</th><th></th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr id="emptyRow"><td colspan="6">まだ地点がありません。地図上のボタンでピンを打ってください。</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="actions">
    <button id="saveJsonBtn" title="作業内容をバックアップ保存">💾</button>
    <button id="loadJsonBtn" title="バックアップから復元">📂</button>
    <button id="exportCsvBtn">CSV出力</button>
    <button id="exportLspBtn">CAD取込LISP</button>
  </div>
</div>

<div id="modalOverlay">
  <div id="modalBox">
    <h2>最初の記号を設定</h2>
    <p>この調査グループの記号を入力してください（例: A, T1, ▲ など）。以降は同じ記号のまま自動で連番が振られます。あとからヘッダーの「記号」欄でいつでも変更できます。</p>
    <input type="text" id="modalSymbolInput" value="A" maxlength="4">
    <button id="modalOkBtn">この記号で開始</button>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="fileInputHidden" accept="application/json">

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.gridlayer.googlemutant@0.14.3/dist/Leaflet.GoogleMutant.min.js"></script>
<script>
/* ============================================================
   CoordinateConverter
   緯度経度(JGD2011/WGS84相当) → 日本の平面直角座標系 X(南北),Y(東西) [m]
   GRS80楕円体・Transverse Mercator、国土地理院の定義と同一。
   iOSアプリ版 CoordinateConverter.swift のロジックをそのまま移植。
============================================================ */
const CoordinateConverter = (() => {
  const a = 6378137.0;
  const f = 1 / 298.257222101;
  const k0 = 0.9999;
  const e2 = f * (2 - f);
  const ePrime2 = e2 / (1 - e2);

  const ORIGINS = {
    7:  [36.0, 137 + 10/60],
    8:  [36.0, 138.5],
    9:  [36.0, 139 + 50/60],
  };

  const deg2rad = d => d * Math.PI / 180;

  function meridionalArc(phi){
    return a * (
      (1 - e2/4 - 3*e2**2/64 - 5*e2**3/256) * phi
      - (3*e2/8 + 3*e2**2/32 + 45*e2**3/1024) * Math.sin(2*phi)
      + (15*e2**2/256 + 45*e2**3/1024) * Math.sin(4*phi)
      - (35*e2**3/3072) * Math.sin(6*phi)
    );
  }

  function toPlaneRectangular(latitude, longitude, zone){
    const o = ORIGINS[zone];
    if(!o) return {x:0, y:0};
    const phi = deg2rad(latitude), phi0 = deg2rad(o[0]);
    const lambda = deg2rad(longitude), lambda0 = deg2rad(o[1]);
    const dLambda = lambda - lambda0;
    const sinPhi = Math.sin(phi), cosPhi = Math.cos(phi), tanPhi = Math.tan(phi);
    const N = a / Math.sqrt(1 - e2*sinPhi*sinPhi);
    const T = tanPhi*tanPhi;
    const C = ePrime2*cosPhi*cosPhi;
    const A = dLambda*cosPhi;
    const M = meridionalArc(phi), M0 = meridionalArc(phi0);

    const easting = k0 * N * (
      A
      + (1 - T + C) * A**3 / 6
      + (5 - 18*T + T*T + 72*C - 58*ePrime2) * A**5 / 120
    );
    const northing = k0 * (
      M - M0
      + N * tanPhi * (
        A**2/2
        + (5 - T + 9*C + 4*C*C) * A**4/24
        + (61 - 58*T + T*T + 600*C - 330*ePrime2) * A**6/720
      )
    );
    return { x: northing, y: easting }; // X=南北(北+), Y=東西(東+)
  }

  return { toPlaneRectangular };
})();

/* ============================================================
   状態
============================================================ */
let points = [];          // {label,symbol,sequence,lat,lon,elevation,accuracy,zone,x,y,species,memo,ts}
let seqBySymbol = {};      // 記号ごとの連番カウンタ
let lastPosition = null;   // 直近のGeolocation Position
let symbolLocked = false;

const zoneSelect   = document.getElementById('zoneSelect');
const symbolInput  = document.getElementById('symbolInput');
const gpsDot       = document.getElementById('gpsDot');
const gpsText      = document.getElementById('gpsText');
const pinBtn       = document.getElementById('pinBtn');
const nextLabel    = document.getElementById('nextLabel');
const tbody        = document.getElementById('tbody');
const emptyRow     = document.getElementById('emptyRow');
const countBadge   = document.getElementById('countBadge');
const modalOverlay = document.getElementById('modalOverlay');
const modalSymbolInput = document.getElementById('modalSymbolInput');

/* ---------- 地図初期化 (長野県中心) ---------- */
/* Google Mapsを使う場合は、下のGOOGLE_MAPS_API_KEYに取得したAPIキーを貼り付けてください。
   未設定(初期値のまま)の場合や読み込みに失敗した場合も、他の地図はそのまま使えます。 */
const GOOGLE_MAPS_API_KEY = "YOUR_GOOGLE_MAPS_API_KEY";

const map = L.map('map', { zoomControl:false }).setView([36.65, 138.18], 12);
L.control.zoom({ position:'bottomleft' }).addTo(map);

const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 21,
  maxNativeZoom: 19, // OSMタイルの精細な画像は19までのため、それ以降は自動で拡大表示(やや粗くなる)
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

/* 国土地理院(GSI)タイル: APIキー・請求先登録が一切不要、無料・商用利用も可(要出典表示) */
const gsiStdLayer = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
  maxZoom: 19, maxNativeZoom: 18,
  attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
});
const gsiPhotoLayer = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
  maxZoom: 19, maxNativeZoom: 18,
  attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
});

const baseLayers = {
  '地図(OpenStreetMap)': osmLayer,
  '地図(国土地理院)': gsiStdLayer,
  '航空写真(国土地理院)': gsiPhotoLayer
};
const layerControl = L.control.layers(baseLayers, null, { position:'topright', collapsed:true }).addTo(map);

/* Googleマップは読み込みに成功した場合のみ、切り替え候補として追加する。
   失敗してもOSM/国土地理院はそのまま使えるため、画面が壊れることはない。 */
function tryLoadGoogleMaps(){
  if(!GOOGLE_MAPS_API_KEY || GOOGLE_MAPS_API_KEY.indexOf('YOUR_GOOGLE_MAPS') === 0){
    return; // 未設定。他の地図を使う。
  }
  window.__onGoogleMapsLoaded = function(){
    try{
      const gLayer = L.gridLayer.googleMutant({ type: 'roadmap', maxZoom: 21 });
      layerControl.addBaseLayer(gLayer, 'Googleマップ');
      showToast('Googleマップが切り替え候補に追加されました(右上のアイコンから選択できます)');
    }catch(e){
      showToast('Googleマップの読み込みに失敗しました。他の地図をご利用ください');
    }
  };
  const s = document.createElement('script');
  s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(GOOGLE_MAPS_API_KEY)}&loading=async&callback=__onGoogleMapsLoaded`;
  s.async = true;
  s.onerror = () => showToast('Google Maps APIの読み込みに失敗しました。他の地図をご利用ください');
  document.head.appendChild(s);
}
tryLoadGoogleMaps();

let userMarker = null;
const pinLayer = L.layerGroup().addTo(map);

function updateNextLabel(){
  const sym = symbolInput.value.trim() || 'A';
  const next = (seqBySymbol[sym] || 0) + 1;
  nextLabel.textContent = `${sym}${next}`;
}
symbolInput.addEventListener('input', updateNextLabel);

/* ---------- GPS ---------- */
function setGpsStatus(state, text){
  gpsDot.className = state;
  gpsText.textContent = text;
}

if(!('geolocation' in navigator)){
  setGpsStatus('', '端末が位置情報に非対応です');
  pinBtn.disabled = true;
} else {
  navigator.geolocation.watchPosition(pos => {
    lastPosition = pos;
    const { latitude, longitude, accuracy, altitude } = pos.coords;

    if(!userMarker){
      userMarker = L.circleMarker([latitude, longitude], {
        radius:7, color:'#fff', weight:2, fillColor:'#2b8ce0', fillOpacity:1
      }).addTo(map);
      map.setView([latitude, longitude], 19);
    } else {
      userMarker.setLatLng([latitude, longitude]);
    }

    if(accuracy <= 15){
      setGpsStatus('ok', `高精度 (±${Math.round(accuracy)}m)`);
    } else if(accuracy <= 40){
      setGpsStatus('warn', `やや誤差あり (±${Math.round(accuracy)}m)`);
    } else {
      setGpsStatus('warn', `誤差大 (±${Math.round(accuracy)}m)`);
    }
    pinBtn.disabled = false;
  }, err => {
    let msg = '位置情報を取得できません';
    if(err.code === err.PERMISSION_DENIED) msg = '位置情報の利用が許可されていません';
    else if(err.code === err.TIMEOUT) msg = '位置情報の取得がタイムアウトしました';
    setGpsStatus('', msg);
  }, {
    enableHighAccuracy: true,
    maximumAge: 1000,
    timeout: 15000
  });
}

document.getElementById('recenterBtn').addEventListener('click', () => {
  if(lastPosition){
    map.setView([lastPosition.coords.latitude, lastPosition.coords.longitude], Math.max(map.getZoom(), 19));
  } else {
    showToast('現在地をまだ取得できていません');
  }
});

/* ---------- 記号の初回設定モーダル ---------- */
window.addEventListener('load', () => {
  modalOverlay.classList.add('show');
});
document.getElementById('modalOkBtn').addEventListener('click', () => {
  const v = modalSymbolInput.value.trim();
  if(v){ symbolInput.value = v; }
  symbolLocked = true;
  modalOverlay.classList.remove('show');
  updateNextLabel();
});

/* ---------- ピンを打つ ---------- */
pinBtn.addEventListener('click', () => {
  if(!lastPosition){
    showToast('現在地を取得中です。少し待ってから押してください。');
    return;
  }
  const { latitude, longitude, accuracy, altitude } = lastPosition.coords;
  const symbol = symbolInput.value.trim() || 'A';
  const zone = parseInt(zoneSelect.value, 10);
  const seq = (seqBySymbol[symbol] || 0) + 1;
  seqBySymbol[symbol] = seq;

  const { x, y } = CoordinateConverter.toPlaneRectangular(latitude, longitude, zone);

  const point = {
    label: `${symbol}${seq}`,
    symbol, sequence: seq,
    lat: latitude, lon: longitude,
    elevation: (altitude === null || altitude === undefined) ? null : altitude,
    accuracy, zone, x, y,
    species: '', memo: '',
    ts: new Date()
  };
  points.push(point);

  const icon = L.divIcon({
    className: 'leaflet-div-icon',
    html: `<div class="pin-icon"><span>${point.sequence}</span></div>`,
    iconSize:[30,30], iconAnchor:[15,28]
  });
  L.marker([latitude, longitude], { icon }).addTo(pinLayer)
    .bindPopup(`<b>${point.label}</b><br>層: SURVEY_${symbol.toUpperCase()}`);

  updateNextLabel();
  renderTable();
  showToast(`${point.label} を記録しました`);
});

/* ---------- 一覧表 ---------- */
function renderTable(){
  tbody.innerHTML = '';
  if(points.length === 0){
    tbody.appendChild(emptyRow);
    countBadge.textContent = '0件';
    return;
  }
  countBadge.textContent = `${points.length}件`;

  points.forEach((p, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="label">${p.label}</td>
      <td class="coord">${p.lat.toFixed(6)}</td>
      <td class="coord">${p.lon.toFixed(6)}</td>
      <td><input data-idx="${idx}" data-field="species" type="text" value="${escapeAttr(p.species)}" placeholder="樹種"></td>
      <td><input data-idx="${idx}" data-field="memo" type="text" value="${escapeAttr(p.memo)}" placeholder="メモ"></td>
      <td><button class="delBtn" data-idx="${idx}">✕</button></td>
    `;
    tbody.appendChild(tr);
  });
}

tbody.addEventListener('input', e => {
  const t = e.target;
  if(t.tagName !== 'INPUT') return;
  const idx = parseInt(t.dataset.idx, 10);
  const field = t.dataset.field;
  if(field === 'elevation'){
    const v = parseFloat(t.value);
    points[idx].elevation = isNaN(v) ? null : v;
  } else {
    points[idx][field] = t.value;
  }
});

tbody.addEventListener('click', e => {
  if(e.target.classList.contains('delBtn')){
    const idx = parseInt(e.target.dataset.idx, 10);
    removePoint(idx);
  }
});

function removePoint(idx){
  const p = points[idx];
  if(!confirm(`${p.label} を削除しますか？`)) return;
  points.splice(idx, 1);
  rebuildMarkers();
  renderTable();
}

function rebuildMarkers(){
  pinLayer.clearLayers();
  points.forEach(p => {
    const icon = L.divIcon({
      className: 'leaflet-div-icon',
      html: `<div class="pin-icon"><span>${p.sequence}</span></div>`,
      iconSize:[30,30], iconAnchor:[15,28]
    });
    L.marker([p.lat, p.lon], { icon }).addTo(pinLayer)
      .bindPopup(`<b>${p.label}</b><br>層: SURVEY_${p.symbol.toUpperCase()}`);
  });
}

function escapeAttr(s){
  return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

/* ---------- 折りたたみシート（ドラッグでリサイズ） ---------- */
(function initSheetDrag(){
  const sheet = document.getElementById('sheet');
  const handle = document.getElementById('sheetHandle');
  let startY = 0, startH = 0, dragging = false;

  function begin(y){
    dragging = true; startY = y;
    startH = sheet.getBoundingClientRect().height;
  }
  function move(y){
    if(!dragging) return;
    const delta = startY - y;
    let h = startH + delta;
    const vh = window.innerHeight;
    h = Math.max(120, Math.min(h, vh * 0.75));
    sheet.style.height = h + 'px';
  }
  function end(){ dragging = false; }

  handle.addEventListener('touchstart', e => begin(e.touches[0].clientY), {passive:true});
  handle.addEventListener('touchmove', e => move(e.touches[0].clientY), {passive:true});
  handle.addEventListener('touchend', end);
  handle.addEventListener('mousedown', e => begin(e.clientY));
  window.addEventListener('mousemove', e => move(e.clientY));
  window.addEventListener('mouseup', end);
})();

/* ---------- トースト ---------- */
let toastTimer = null;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ============================================================
   CSV出力 (AutoCAD 2026 取込用 / import_points.lsp と同一列構成)
   列: No,Symbol,Layer,Lat,Lon,Elevation_m,PlaneZone,X_m,Y_m,TreeSpecies,Memo,Timestamp
============================================================ */
/* 日本標準時(UTC+9)基準で "20260905125459" のような連続整数の日時文字列を作る。
   Date#getTime()は常にタイムゾーンに依存しない絶対時刻(エポックms)を返すため、
   そこに+9時間した上でgetUTC系のgetterで読み出すことで、
   端末のタイムゾーン設定に左右されず常にJSTの値を取り出せる。 */
function jstTimestampCompact(date){
  const jst = new Date(date.getTime() + 9 * 60 * 60 * 1000);
  const pad = n => String(n).padStart(2, '0');
  return `${jst.getUTCFullYear()}${pad(jst.getUTCMonth()+1)}${pad(jst.getUTCDate())}`
       + `${pad(jst.getUTCHours())}${pad(jst.getUTCMinutes())}${pad(jst.getUTCSeconds())}`;
}

function csvEscape(field){
  const s = String(field ?? '');
  if(s.includes(',') || s.includes('"') || s.includes('\n')){
    return '"' + s.replace(/"/g,'""') + '"';
  }
  return s;
}

function buildCsv(){
  const header = 'No,Symbol,Layer,Lat,Lon,Elevation_m,PlaneZone,X_m,Y_m,TreeSpecies,Memo,Timestamp';
  const rows = points.map(p => [
    p.label,
    p.symbol,
    `SURVEY_${p.symbol.toUpperCase()}`,
    p.lat.toFixed(6),
    p.lon.toFixed(6),
    p.elevation === null ? '' : p.elevation.toFixed(2),
    String(p.zone),
    p.x.toFixed(3),
    p.y.toFixed(3),
    csvEscape(p.species),
    csvEscape(p.memo),
    jstTimestampCompact(p.ts)
  ].join(','));
  return '\uFEFF' + [header, ...rows].join('\r\n');
}

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function timestampForFile(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}

document.getElementById('exportCsvBtn').addEventListener('click', () => {
  if(points.length === 0){ showToast('出力する地点がありません'); return; }
  downloadBlob(buildCsv(), `survey_${timestampForFile()}.csv`, 'text/csv;charset=utf-8');
  showToast('CSVをダウンロードしました');
});

/* ---------- LISPスクリプトの再配布 ---------- */
document.getElementById('exportLspBtn').addEventListener('click', () => {
  downloadBlob(IMPORT_LSP_TEXT, 'import_points.lsp', 'text/plain;charset=utf-8');
  showToast('import_points.lsp をダウンロードしました');
});

/* ---------- 作業内容のバックアップ(JSON手動保存/復元) ---------- */
document.getElementById('saveJsonBtn').addEventListener('click', () => {
  if(points.length === 0){ showToast('保存する地点がありません'); return; }
  const data = { seqBySymbol, points: points.map(p => ({...p, ts: p.ts.toISOString()})) };
  downloadBlob(JSON.stringify(data, null, 2), `survey_backup_${timestampForFile()}.json`, 'application/json');
  showToast('バックアップを保存しました');
});
document.getElementById('loadJsonBtn').addEventListener('click', () => {
  document.getElementById('fileInputHidden').click();
});
document.getElementById('fileInputHidden').addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      points = data.points.map(p => ({...p, ts: new Date(p.ts)}));
      seqBySymbol = data.seqBySymbol || {};
      rebuildMarkers();
      renderTable();
      updateNextLabel();
      if(points.length){
        map.setView([points[points.length-1].lat, points[points.length-1].lon], 19);
      }
      showToast(`${points.length}件を復元しました`);
    }catch(err){
      showToast('読み込みに失敗しました（JSON形式を確認してください）');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ---------- 同梱する import_points.lsp の本文 ---------- */
const IMPORT_LSP_TEXT = `;;; ============================================================
;;;  IMPORTPOINTS.LSP
;;;  iPhone調査アプリが出力したCSVを読み込み、AutoCAD上に
;;;  レイヤー別のPOINTエンティティと番号ラベル(TEXT)を一括作成する。
;;;
;;;  CSV列構成（1行目はヘッダ、以降1点1行）:
;;;   0:No 1:Symbol 2:Layer 3:Lat 4:Lon 5:Elevation_m 6:PlaneZone
;;;   7:X_m 8:Y_m 9:TreeSpecies 10:Memo 11:Timestamp
;;;
;;;  注意（座標軸の向き）:
;;;   CSVのX_mは測量慣習で「南北方向(北が+)」、Y_mは「東西方向(東が+)」です。
;;;   AutoCADの図面座標(WCS)はX=右(東)、Y=上(北)が一般的なので、
;;;   本スクリプトでは CAD上のX座標 = CSVのY_m、CAD上のY座標 = CSVのX_m
;;;   として入れ替えてプロットします（真北を画面の上に合わせるため）。
;;;
;;;  使い方:
;;;   1. APPLOAD でこのファイルをロード
;;;   2. コマンドラインで IMPORTPOINTS と入力
;;;   3. CSVファイルを選択
;;;   4. 標高はPOINTのZ値として設定されます（3D座標）
;;; ============================================================

(defun c:IMPORTPOINTS ( / f line firstLine fields lay num x y z species memo
                          csvPath oldEcho oldOsmode ptList count zoom)

  (setq oldEcho (getvar "CMDECHO"))
  (setq oldOsmode (getvar "OSMODE"))
  (setvar "CMDECHO" 0)
  (setvar "OSMODE" 0)

  (setq csvPath (getfiled "調査ポイントCSVを選択" "" "csv" 8))
  (if (null csvPath)
    (progn
      (princ "\\nキャンセルされました。")
      (setvar "CMDECHO" oldEcho)
      (setvar "OSMODE" oldOsmode)
      (princ)
    )
    (progn
      (setq f (open csvPath "r"))
      (setq firstLine T)
      (setq count 0)

      (if (null f)
        (progn
          (princ (strcat "\\nファイルを開けませんでした: " csvPath))
        )
        (progn
          (while (setq line (read-line f))
            (if firstLine
              (setq firstLine nil) ;; ヘッダ行はスキップ
              (progn
                (setq line (vl-string-trim "\\r" line))
                (if (> (strlen line) 0)
                  (progn
                    (setq fields (LGT:CsvSplit line))
                    (if (>= (length fields) 9)
                      (progn
                        (setq num     (nth 0 fields))
                        (setq lay     (nth 2 fields))
                        (setq z       (atof (nth 5 fields)))
                        (setq x       (atof (nth 7 fields))) ;; X_m (南北)
                        (setq y       (atof (nth 8 fields))) ;; Y_m (東西)
                        (setq species (if (>= (length fields) 10) (nth 9 fields) ""))
                        (setq memo    (if (>= (length fields) 11) (nth 10 fields) ""))

                        ;; 座標入れ替え: CAD-X = Y_m(東西), CAD-Y = X_m(南北)
                        (setq ptList (list y x z))

                        ;; レイヤーが無ければ作成
                        (if (null (tblsearch "LAYER" lay))
                          (command "._-LAYER" "_N" lay "")
                        )

                        ;; POINTエンティティ作成
                        (entmakex
                          (list
                            '(0 . "POINT")
                            (cons 8 lay)
                            (cons 10 ptList)
                          )
                        )

                        ;; 番号ラベル(TEXT)をポイントの右上に配置
                        (entmakex
                          (list
                            '(0 . "TEXT")
                            (cons 8 lay)
                            (cons 10 (list (+ y 0.3) (+ x 0.3) z))
                            (cons 40 1.0)              ;; 文字高さ(必要に応じて調整)
                            (cons 1 num)
                            (cons 7 (getvar "TEXTSTYLE"))
                          )
                        )

                        (setq count (1+ count))
                      )
                    )
                  )
                )
              )
            )
          )
          (close f)
          (princ (strcat "\\n" (itoa count) " 点をインポートしました。"))
          (command "._ZOOM" "_E")
        )
      )

      (setvar "CMDECHO" oldEcho)
      (setvar "OSMODE" oldOsmode)
      (princ)
    )
  )
  (princ)
)

;; 簡易CSVパーサ（ダブルクォート囲み・カンマ区切りに対応した最小実装）
(defun LGT:CsvSplit (line / result cur inQuotes ch i n)
  (setq result '())
  (setq cur "")
  (setq inQuotes nil)
  (setq n (strlen line))
  (setq i 1)
  (while (<= i n)
    (setq ch (substr line i 1))
    (cond
      ((and (= ch "\\"") inQuotes)
       (if (and (< i n) (= (substr line (1+ i) 1) "\\""))
         (progn (setq cur (strcat cur "\\"")) (setq i (1+ i)))
         (setq inQuotes nil)
       )
      )
      ((= ch "\\"") (setq inQuotes T))
      ((and (= ch ",") (not inQuotes))
       (setq result (append result (list cur)))
       (setq cur "")
      )
      (T (setq cur (strcat cur ch)))
    )
    (setq i (1+ i))
  )
  (setq result (append result (list cur)))
  result
)

(princ "\\nIMPORTPOINTS.LSP をロードしました。コマンド: IMPORTPOINTS")
(princ)
`;
